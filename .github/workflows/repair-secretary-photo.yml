name: Repair secretary LINE photo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-secretary-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Embed secretary images for reliable display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          for name in ('secretary-evidence.jpg', 'secretary-line-avatar.jpg'):
              image_path = Path('assets') / name
              if not image_path.is_file():
                  raise FileNotFoundError(image_path)
              original_src = 'assets/' + name
              embedded_src = 'data:image/jpeg;base64,' + base64.b64encode(image_path.read_bytes()).decode('ascii')
              if original_src in html:
                  html = html.replace(original_src, embedded_src)
              elif embedded_src not in html:
                  raise RuntimeError(f'Missing expected image reference: {original_src}')
          if '"@secretary-photo"' not in html and "'@secretary-photo'" not in html:
              raise RuntimeError('Secretary photo message handler missing')
          page.write_text(html, encoding='utf-8')
          PY
      - name: Commit the repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix missing secretary LINE photo"
            git push
          fi
