name: Repair secretary LINE photo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-secretary-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use replaceable secretary photo asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          html, count = re.subn(
              r"(image\.src = message\.text === '@secretary-photo' \? )'[^']*'",
              r"\1'assets/secretaryevidence.jpg'",
              html,
          )
          if count != 1:
              raise RuntimeError('Expected one secretary photo source')
          if not Path('assets/secretaryevidence.jpg').is_file():
              raise FileNotFoundError('assets/secretaryevidence.jpg')
          if '"@secretary-photo"' not in html and "'@secretary-photo'" not in html:
              raise RuntimeError('Secretary photo message handler missing')
          page.write_text(html, encoding='utf-8')
          PY
      - name: Commit the repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix missing secretary LINE photo"
            git push
          fi
