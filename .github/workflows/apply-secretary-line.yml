name: Add secretary LINE chat (revised)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-secretary-line.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add secretary chat
        run: python .github/scripts/apply_secretary_line.py
      - name: Commit site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Integrate secretary LINE chat into main site"
            git push
          fi
