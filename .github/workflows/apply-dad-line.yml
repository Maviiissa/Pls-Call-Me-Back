name: Apply Dad LINE chat patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dad-line.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply chat updates
        run: python .github/scripts/apply_dad_line.py
      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply Dad LINE messages and shared send arrow"
          git push
